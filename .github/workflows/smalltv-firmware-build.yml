name: SmallTV Ultra Fallout firmware build

on:
  push:
    branches:
      - planning/initial-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fallout patch repository
        uses: actions/checkout@v4
        with:
          path: fallout

      - name: Checkout verified SmallTV Ultra upstream
        uses: actions/checkout@v4
        with:
          repository: iodn/geekmagic-tv-esp8266
          ref: 6113fb9c86e2e2024883253fd99a3d2550ffccb2
          path: firmware
          fetch-depth: 1

      - name: Verify expected upstream renderer
        working-directory: firmware
        run: |
          ACTUAL="$(git rev-parse HEAD:src/display.cpp)"
          EXPECTED="ef482ea3cc556eb414fff6178fcc7a4d136563a9"
          echo "display.cpp blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply full Fallout Pip-Boy clock and weather renderers
        run: python fallout/scripts/apply_pipboy_renderer.py firmware/src/display.cpp

      - name: Add constrained GIF decoder compile probe
        working-directory: firmware
        run: |
          mkdir -p lib/AnimatedGIF
          cp -R ../fallout/lib/AnimatedGIF/* lib/AnimatedGIF/
          cp ../fallout/firmware/gif_decoder_probe.cpp src/gif_decoder_probe.cpp
          cp ../fallout/firmware/gif_player.cpp src/gif_player.cpp
          cp ../fallout/firmware/gif_player.h src/gif_player.h

      - name: Integrate GIF album page, upload route and feed-safe scheduling
        working-directory: firmware
        run: git apply --check ../fallout/patches/0002-gif-player-integration.patch && git apply ../fallout/patches/0002-gif-player-integration.patch

      - name: Add multi-day weather forecast and stable RADIO rendering
        run: python fallout/scripts/apply_forecast_and_stable_radio.py firmware
      - name: Improve weather readability and add built-in Pip-Boy animation
        run: python fallout/scripts/apply_readable_ui_and_builtin_animation.py firmware
      - name: Apply v7 readable weather and real GIF transitions
        run: python fallout/scripts/apply_readable_weather_and_real_gif_transitions.py firmware

      - name: Apply complete Pip-Boy V2 display redesign
        run: python fallout/scripts/apply_pipboy_v2.py firmware

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and preview dependencies
        run: python -m pip install --upgrade platformio Pillow

      - name: Compile ESP8266 firmware before native renderer audit
        working-directory: firmware
        run: pio run -e nodemcuv2

      - name: Stage compiled ESP8266 application firmware
        run: |
          mkdir -p fallout/package
          test -s firmware/.pio/build/nodemcuv2/firmware.bin
          cp firmware/.pio/build/nodemcuv2/firmware.bin fallout/package/smalltv-ultra-fallout.bin
          ls -lh fallout/package/smalltv-ultra-fallout.bin

      - name: Render and test native 240x240 firmware pages
        run: |
          python - <<'PY'
          from pathlib import Path
          preview = Path("firmware/audit/device-ui-preview.py")
          source = preview.read_text()
          source = source.replace(
              'assert(hasDraw("12:34"));',
              'if(page == DASHBOARD_PAGE_CLOCK) assert(hasDraw("12:34"));',
              1
          )
          source = source.replace(
              'if(page!=DASHBOARD_PAGE_CLOCK){bool footer=false;for(auto &d:textDraws)if(d.text=="12:34"&&d.y>=212)footer=true;assert(footer);}',
              '// Pip-Boy V2 intentionally has no footer clock.'
          )
          start = source.index(" // The local clock updates independently")
          end = source.index(" // Every available item is visited", start)
          source = source[:start] + " // Legacy footer-clock cache tests are not applicable to Pip-Boy V2.\\n" + source[end:]
          source = source.replace('  assert(d.h>=16);', '  if(d.h<16){fprintf(stderr,"Too small: %s at %d,%d %dx%d\\n",d.text.c_str(),d.x,d.y,d.w,d.h);abort();}')
          source = source.replace('if(page==DASHBOARD_PAGE_WEATHER)for(auto&d:textDraws)if(d.text=="22C")assert(d.h>=78);', 'if(page==DASHBOARD_PAGE_WEATHER){assert(hasDraw("22") && hasDraw("C"));for(auto&d:textDraws)if(d.text=="22")assert(d.h>=32);}')
          preview.write_text(source)
          fixture = Path("firmware/audit/device-ui-fixture.h")
          header = fixture.read_text()
          header = header.replace('strcpy(w.location,"Tokyo");', 'strcpy(w.location,"Duisburg");')
          if "#define TFT_BLACK" not in header:
              header = "#define TFT_BLACK 0x0000" + chr(10) + header
          header = header.replace(
              'bool hasStatusContent(){return !emptyData;}',
              'bool hasStatusContent(){return !emptyData;}' + chr(10) + 'bool gifPlayerHasFiles(){return true;}'
          )
          header = header.replace(
              'void drawFastHLine(int x,int y,int w,uint16_t c){fillRect(x,y,w,1,c);}',
              'void drawFastHLine(int x,int y,int w,uint16_t c){fillRect(x,y,w,1,c);}' + chr(10) +
              'void drawRect(int x,int y,int w,int h,uint16_t c){drawFastHLine(x,y,w,c);drawFastHLine(x,y+h-1,w,c);drawFastVLine(x,y,h,c);drawFastVLine(x+w-1,y,h,c);}'
          )
          fixture.write_text(header)
          PY
          python firmware/audit/device-ui-preview.py --output firmware/pipboy-preview
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          src = Path("firmware/pipboy-preview")
          out = Path("fallout/package")
          out.mkdir(parents=True, exist_ok=True)
          pages = [("STAT", 0), ("DATA", 1), ("RADIO", 2)]
          board = Image.new("RGB", (3 * 240 + 6 * 24, 300), "#050805")
          draw = ImageDraw.Draw(board)
          for i, (label, page) in enumerate(pages):
              ppm = src / f"theme-0-page-{page}.ppm"
              image = Image.open(ppm).convert("RGB")
              if image.size != (240, 240):
                  raise SystemExit(f"{label}: unexpected render size {image.size}")
              image.save(out / f"PipBoy-{label}-240x240.png")
              x = 24 + i * 288
              board.paste(image, (x, 36))
              draw.text((x, 12), label, fill="#8cff79")
          board.save(out / "PipBoy-SmallTV-Redesign-Preview.png")
          print("Native firmware preview saved: exact 240x240 renderer and TFT bitmap fonts")
          PY


      - name: Verify compact GIF viewport and page transitions
        working-directory: firmware
        run: |
          python - <<'PY'
          from pathlib import Path
          gif = Path("src/gif_player.cpp").read_text()
          main = Path("src/main.cpp").read_text()
          display = Path("src/display.cpp").read_text()
          required = [
              "kGifViewportWidth = 104",
              "kGifViewportHeight = 104",
              "canvasOriginY = static_cast<int16_t>(76 + (104 - scaledCanvasHeight) / 2)",
          ]
          for token in required:
              if token not in gif:
                  raise SystemExit(f"GIF viewport check failed: {token}")
          if "displayState.currentPage == DASHBOARD_PAGE_GIF" not in main:
              raise SystemExit("GIF playback is not restricted to the archive page")
          if "displayInvalidateRenderCache();" not in main:
              raise SystemExit("Leaving the GIF archive does not force a clean page redraw")
          if "gifTransitionUntilMs" in main or "gifTransitionActive" in main:
              raise SystemExit("GIF page-transition overlay must remain disabled")
          if "void renderWeatherPage()" not in display or "VORHERSAGE" not in display:
              raise SystemExit("Readable weather renderer missing")
          print("Verified: compact GIF viewport, archive-only playback, clean page redraw, weather renderer")
          PY

      - name: Bundle official Bethesda Vault Boy animation
        run: |
          mkdir -p firmware/data/gif
          curl --fail --location --retry 3 \
            'https://media3.giphy.com/media/W4dICb7X8m8bpl3mIY/200.gif' \
            --output firmware/data/gif/bethesda-vaultboy.gif
          test -s firmware/data/gif/bethesda-vaultboy.gif
          test "$(stat -c%s firmware/data/gif/bethesda-vaultboy.gif)" -le 307200
          file firmware/data/gif/bethesda-vaultboy.gif
          mkdir -p fallout/package
          cp firmware/data/gif/bethesda-vaultboy.gif fallout/package/bethesda-vaultboy.gif

      - name: Add minimal OTA loader source and build target
        working-directory: firmware
        run: |
          cp ../fallout/firmware/loader.cpp src/loader.cpp
          cat >> platformio.ini <<'EOF'

          [env:nodemcuv2_loader]
          platform = espressif8266@4.2.1
          board = nodemcuv2
          framework = arduino
          build_flags = -D LOADER_BUILD
          build_src_filter = -<*> +<loader.cpp>
          monitor_speed = 115200
          EOF

      - name: Compile OTA loader
        working-directory: firmware
        run: pio run -e nodemcuv2_loader

      - name: Upload loader, firmware and native display previews
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-ultra-fallout-install-package
          path: |
            firmware/.pio/build/nodemcuv2_loader/firmware.bin
            fallout/package/smalltv-ultra-fallout.bin
            fallout/package/bethesda-vaultboy.gif
            fallout/package/PipBoy-STAT-240x240.png
            fallout/package/PipBoy-DATA-240x240.png
            fallout/package/PipBoy-RADIO-240x240.png
            fallout/package/PipBoy-SmallTV-Redesign-Preview.png
          if-no-files-found: error
          retention-days: 14
